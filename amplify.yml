version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
          - '!node_modules/**'
          - '!.next/**'
          - '!out/**'
          - '!.git/**'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
